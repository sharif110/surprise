<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vidya ❤️</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --soft-white: #f8f1f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background: #0a0a0a;
            color: var(--soft-white);
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover;
            z-index: -2;
            filter: brightness(0.4) blur(1px);
            transition: filter 2s ease;
        }

        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            z-index: 10;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2.5s ease;
        }

        h1 {
            font-size: 3.5rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .question {
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn-wrap {
            position: relative;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        #yes-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s;
            animation: pulse 2s infinite;
            color: #222;
            z-index: 100;
        }

        #no-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            color: #222;
            transition: all 0.2s ease;
            touch-action: none; /* Crucial for mobile */
        }

        #success-msg {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
        }

        .final-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 15px 0;
            font-style: italic;
        }

        .gallery {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .photo {
            width: 70px;
            height: 100px;
            background: #222;
            border: 2px solid var(--gold);
            border-radius: 5px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .photo:hover {
            transform: scale(3.5);
            z-index: 200;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .photo { width: 60px; height: 80px; }
        }
    </style>
</head>

<body>

    <div id="bg-image"></div>
    <canvas id="particles-container"></canvas>

    <div class="container" id="main-content">
        <h1>Vidya ❤️</h1>
        <p class="question">Will you be my Valentine?</p>

        <div class="btn-wrap">
            <button id="yes-btn" onclick="handleYes()">YES ❤️</button>
            <button id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo()">No</button>
        </div>
    </div>

    <div class="container" id="success-msg">
        <h1 style="font-size: 2.2rem;">She said YES</h1>
        <p class="final-text">Vidya, you turned my chaos into calm and somehow upgraded my entire life.</p>
        <p class="final-text">Since you clearly have excellent taste in men… let’s celebrate properly.</p>
        <p style="color: var(--gold); font-weight: bold; margin-bottom: 5px;">Dinner tonight? Be ready at 8 PM ❤️</p>
        <p style="color: var(--gold); font-weight: bold;">Forever yours, Sharif ❤️</p>

        <div class="gallery">
            <img src="Pictures/photo12.jpeg" class="photo" alt="12">
            <img src="Pictures/photo14.jpeg" class="photo" alt="14">
            <img src="Pictures/photo10.jpeg" class="photo" alt="10">
            <img src="Pictures/photo11.jpeg" class="photo" alt="11">
            <img src="Pictures/photo1.jpeg" class="photo" alt="1">
            <img src="Pictures/photo2.jpeg" class="photo" alt="2">
            <img src="Pictures/photo3.jpeg" class="photo" alt="3">
            <img src="Pictures/photo4.jpeg" class="photo" alt="4">
            <img src="Pictures/photo5.jpeg" class="photo" alt="5">
            <img src="Pictures/photo6.jpeg" class="photo" alt="6">
            <img src="Pictures/photo7.jpeg" class="photo" alt="7">
            <img src="Pictures/photo8.jpeg" class="photo" alt="8">
            <img src="Pictures/photo9.jpeg" class="photo" alt="9">
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Particle Background
        const canvas = document.getElementById('particles-container');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5;
                this.opacity = Math.random();
            }
            update() { this.y -= this.speed; if (this.y < 0) this.y = canvas.height; }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 80; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Movable "No" Button Logic (Mobile & Desktop)
        function moveNo(e) {
            if(e) e.preventDefault();
            const btn = document.getElementById('no-btn');
            // Safe zone calculation
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
            
            btn.style.position = 'fixed';
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
        }

        // Handle "Yes" Click
        function handleYes() {
            document.getElementById('main-content').style.display = 'none';
            const success = document.getElementById('success-msg');
            success.style.display = 'block';
            
            setTimeout(() => { 
                success.style.opacity = '1'; 
                success.style.transform = 'translateY(0)'; 
            }, 50);

            // Audio Logic
            const audio = document.getElementById('bg-music');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio play blocked by browser."));

            document.getElementById('bg-image').style.filter = "brightness(0.6) blur(0px)";
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "100vh";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
    </script>
</body>
</html>
