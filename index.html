<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vidya ❤️</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --crimson: #8e0000;
            --soft-white: #f8f1f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background: #0a0a0a;
            color: var(--soft-white);
            overflow: auto;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Luxury Background */
        /* Beach Luxury Background */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* This link pulls a beautiful high-res beach sunset */
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover;
            z-index: -2;
            filter: brightness(0.4) blur(1px);
            /* Slightly darker so Vidya's name pops */
            transition: filter 2s ease;
        }

        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* UI Containers */
        .container {
            z-index: 10;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            animation: fadeIn 2.5s ease;
        }

        h1 {
            font-size: 4rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .question {
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Countdown */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .count-item span {
            display: block;
            font-size: 2rem;
            color: var(--gold);
        }

        /* Buttons */
        .btn-wrap {
            position: relative;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        #yes-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
            color: #222;
        }

        #no-btn {
            /* background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s ease; */

            background: var(--gold-gradient);
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 81, 55, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
            color: #222;
        }

        /* Success State */
        #success-msg {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
        }

        .final-text {
            font-size: 1.4rem;
            line-height: 1.8;
            margin: 20px 0;
            font-style: italic;
        }

        .gallery {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .photo {
            width: 110px;
            height: 140px;
            background: #222;
            border: 2px solid var(--gold);
            border-radius: 8px;
            object-fit: cover;
            transition: transform 0.25s;
            flex: 0 0 auto;
        }

        .photo:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .gallery { gap: 8px; }
            .photo { width: 28vw; height: 36vw; border-radius: 6px; }
            .photo:hover { transform: none; }
        }

        /* Modal slideshow (responsive + touch-friendly) */
        .slideshow-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slideshow-modal.active { display: flex; }

        .slideshow-inner {
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            position: relative;
        }

        .slideshow-inner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-close, .modal-prev, .modal-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--soft-white);
            background: rgba(0,0,0,0.4);
            border: none;
            padding: 14px;
            font-size: 22px;
            border-radius: 50%;
            cursor: pointer;
        }

        .modal-close { right: 20px; top: 20px; transform: none; }
        .modal-prev { left: 10px; }
        .modal-next { right: 10px; }

        @media (max-width: 600px) {
            .modal-close, .modal-prev, .modal-next { padding: 12px; font-size: 20px; }
        }

        .voice-note {
            margin-top: 20px;
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 0 40px rgba(212, 175, 55, 0.7);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            }
        }

        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            #countdown {
                gap: 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <div id="bg-image"></div>
    <canvas id="particles-container"></canvas>

    <div class="container" id="main-content">
        <h1>Vidya ❤️</h1>
        <p class="question">Will you be my Valentine?</p>
        <!-- 
        <div id="countdown">
            <div class="count-item"><span id="days">00</span>Days</div>
            <div class="count-item"><span id="hours">00</span>Hrs</div>
            <div class="count-item"><span id="mins">00</span>Mins</div>
            <div class="count-item"><span id="secs">00</span>Secs</div>
        </div> -->

        <div class="btn-wrap">
            <button id="yes-btn" onclick="handleYes()">YES ❤️</button>
            <button id="no-btn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <div class="container" id="success-msg">
        <h1 style="font-size: 2.5rem;">She said YES</h1>
        <p class="final-text">
            Vidya, you turned my chaos into calm
            and somehow upgraded my entire life.
        </p>

        <p class="final-text">
            Since you clearly have excellent taste in men…
            let’s celebrate properly.
        </p>

        <p style="color: var(--gold); font-weight: bold;">
            Dinner tonight? Be ready at 8 PM ❤️
        </p>

        <p style="color: var(--gold); font-weight: bold;">Forever yours, Sharif ❤️</p>
        <div class="gallery">

            <img src="Pictures/photo12.jpeg" class="photo" alt="Memory 12">
            <img src="Pictures/photo14.jpeg" class="photo" alt="Memory 14">
            <img src="Pictures/photo10.jpeg" class="photo" alt="Memory 10">
            <img src="Pictures/photo11.jpeg" class="photo" alt="Memory 11">
            <img src="Pictures/photo1.jpeg" class="photo" alt="Memory 1">
            <img src="Pictures/photo2.jpeg" class="photo" alt="Memory 2">
            <img src="Pictures/photo3.jpeg" class="photo" alt="Memory 3">
            <img src="Pictures/photo4.jpeg" class="photo" alt="Memory 4">
            <img src="Pictures/photo5.jpeg" class="photo" alt="Memory 5">
            <img src="Pictures/photo6.jpeg" class="photo" alt="Memory 6">
            <img src="Pictures/photo7.jpeg" class="photo" alt="Memory 7">
            <img src="Pictures/photo8.jpeg" class="photo" alt="Memory 8">
            <img src="Pictures/photo9.jpeg" class="photo" alt="Memory 9">


        </div>

        <!-- Clickable slideshow modal for gallery images -->
        <div class="slideshow-modal" id="slideshowModal" aria-hidden="true">
            <div class="slideshow-inner" id="slideshowInner">
                <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
                <button class="modal-prev" id="modalPrev" aria-label="Previous">‹</button>
                <button class="modal-next" id="modalNext" aria-label="Next">›</button>
                <img src="" alt="" id="modalImage">
            </div>
        </div>

        <!-- <button class="voice-note" onclick="playVoice()">Play My Voice 🎙️</button> -->
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>
    <audio id="voice-msg">
        <source src="your-voice-note.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Particle System (Stars/Dust)
        const canvas = document.getElementById('particles-container');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5;
                this.opacity = Math.random();
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 2. Countdown Timer
        const targetDate = new Date("Feb 14, 2026 00:00:00").getTime();

        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }, 1000);

        // 3. Button Logic
        function moveNo() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
            btn.style.position = 'fixed';
        }

        function handleYes() {
            document.getElementById('main-content').style.display = 'none';
            const success = document.getElementById('success-msg');
            success.style.display = 'block';
            setTimeout(() => { success.style.opacity = '1'; success.style.transform = 'translateY(0)'; }, 50);

            // Play background music
            document.getElementById('bg-music').play();

            // Brighten background
            document.getElementById('bg-image').style.filter = "brightness(0.5) blur(0px)";

            // Start heart rain
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        function playVoice() {
            const voice = document.getElementById('voice-msg');
            voice.play();
        }

        // 4. Gallery modal slideshow (click to open, supports touch swipe)
        (function initGalleryModal(){
            const photos = Array.from(document.querySelectorAll('.photo'));
            const modal = document.getElementById('slideshowModal');
            const modalImg = document.getElementById('modalImage');
            const closeBtn = document.getElementById('modalClose');
            const prevBtn = document.getElementById('modalPrev');
            const nextBtn = document.getElementById('modalNext');
            let currentIndex = 0;
            let touchStartX = 0;
            let touchEndX = 0;

            if (!modal) return;

            function openModal(index){
                currentIndex = index;
                modalImg.src = photos[currentIndex].src;
                modalImg.alt = photos[currentIndex].alt || '';
                modal.classList.add('active');
                modal.setAttribute('aria-hidden','false');
            }

            function closeModal(){
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden','true');
            }

            function showNext(n){
                currentIndex = (currentIndex + n + photos.length) % photos.length;
                modalImg.src = photos[currentIndex].src;
            }

            photos.forEach((p, i) => {
                p.addEventListener('click', (e)=>{ e.preventDefault(); openModal(i); });
                p.style.cursor = 'zoom-in';
            });

            closeBtn.addEventListener('click', closeModal);
            prevBtn.addEventListener('click', ()=> showNext(-1));
            nextBtn.addEventListener('click', ()=> showNext(1));

            // click outside image closes modal
            modal.addEventListener('click', (e)=>{ if (e.target === modal) closeModal(); });

            // keyboard navigation
            window.addEventListener('keydown', (e)=>{
                if (modal.classList.contains('active')){
                    if (e.key === 'ArrowRight') showNext(1);
                    else if (e.key === 'ArrowLeft') showNext(-1);
                    else if (e.key === 'Escape') closeModal();
                }
            });

            // Touch swipe support
            modalImg.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].screenX; });
            modalImg.addEventListener('touchend', (e)=>{
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 40){ showNext(diff < 0 ? 1 : -1); }
            });

        })();
    </script>
</body>

</html>
